scratchStorageClass:
  create: true
consistency:
  rucioCfgSecret: "server-rucio-server.cfg"
  useCron: true

persistentVolumes:
  grid-cern-ch:
    name: csi-cvmfs-grid-pvc
    mountPath: /cvmfs/grid.cern.ch

secretMounts:
  - secretFullName: idpsecrets
    mountPath: /opt/rucio/etc/idpsecrets.json
  - secretFullName: server-rucio-x509up
    mountPath: /opt/proxy-through-secret

apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: dmm
spec:
  releaseName: dmm
  chart:
    spec:
      chart: dmm
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: dmm
  interval: 5m
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: instance-dmm
    - kind: Secret
      name: dmm-db
      valuesKey: password
      targetPath: postgres.env.password

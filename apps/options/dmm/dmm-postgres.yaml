apiVersion: v1
kind: Service
metadata:
  name: dmm-postgres
  labels:
    app.kubernetes.io/name: dmm-postgres
spec:
  selector:
    app.kubernetes.io/name: dmm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dmm-postgres
  labels:
    app.kubernetes.io/name: dmm-postgres
spec:
  serviceName: dmm-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dmm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmm-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: dmm
            - name: POSTGRES_DB
              value: dmm
            # Must match [db] password in dmm.cfg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dmm-db
                  key: password
            # A subdirectory, so initdb doesn't trip over the volume's lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dmm", "-d", "dmm"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
